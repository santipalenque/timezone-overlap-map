<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>timezone-overlap-map</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0 auto; padding: 2rem 1rem; max-width: 48rem; font: 16px/1.5 system-ui, sans-serif; }
      pre { font-size: 0.875rem; opacity: 0.7; }
    </style>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <h1>timezone-overlap-map</h1>
    <timezone-overlap-map home-zone="America/Argentina/Buenos_Aires" home-label="Santiago"></timezone-overlap-map>
    <pre id="log"></pre>
    <script type="module">
      const map = document.querySelector('timezone-overlap-map');
      // ?visitor=Asia/Tokyo to try another zone
      const visitor = new URLSearchParams(location.search).get('visitor');
      if (visitor) map.setAttribute('visitor-zone', visitor);
      map.addEventListener('zonechange', (event) => {
        document.getElementById('log').textContent = `zonechange → ${event.detail.zone}`;
      });
    </script>
  </body>
</html>
